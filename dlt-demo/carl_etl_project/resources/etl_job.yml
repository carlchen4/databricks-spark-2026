resources:
  jobs:
    bank_etl_job:
      name: bank-etl-job

      # 防止并发运行
      max_concurrent_runs: 1

      # 超时 1 小时
      timeout_seconds: 3600

      # 每天 10AM 运行
      schedule:
        quartz_cron_expression: "0 0 10 * * ?"
        timezone_id: "America/Toronto"
        pause_status: "UNPAUSED"

      # 失败通知
      email_notifications:
        on_failure:
          - carlchenn@hotmail.com

      # 定义 Job 专用 Cluster
      job_clusters:
        - job_cluster_key: etl_cluster
          new_cluster:
            spark_version: 13.3.x-scala2.12
            node_type_id: Standard_DS3_v2
            num_workers: 1
            autotermination_minutes: 15

      tasks:
        - task_key: create_source
          job_cluster_key: etl_cluster
          max_retries: 2
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ../src/create_dummy.py

        - task_key: run_etl
          depends_on:
            - task_key: create_source
          job_cluster_key: etl_cluster
          max_retries: 2
          min_retry_interval_millis: 300000
          notebook_task:
            notebook_path: ../src/create_dummy.py